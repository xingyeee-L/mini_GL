[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mini-gl"
version = "0.1.0"
description = "Local-first, permission-aware personal knowledge retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - educational project" }
authors = [{ name = "mini_GL contributors" }]
dependencies = [
  "pypdf>=6,<7",
]

[project.scripts]
mini-gl = "mini_gl.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]
ml = [
  "psutil>=7,<8",
  "sentence-transformers>=5.7,<6",
  "torch>=2.14,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mini_gl"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mini_gl"]
